# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs snake contribuition script
      - name: generate-snake-game-from-github-contribution-grid
          # You may pin to the exact commit or the version.
          # uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        uses: Platane/snk@v3.5.0
        with:
          # github user name
          github_user_name: SoldadoZuero
          # github token used to fetch the contribution calendar. Default to the action token if empty.
          github_token: ${{ github.token }} # optional, default is ${{ github.token }}
          # list of files to generate.
          # one file per line. Each output can be customized with options as query string.
      
          # supported query string options:
        
           #  - palette:      A preset of color, one of [github, github-dark, github-light]
           #  - color_snake:  Color of the snake
           #  - color_dots:   Coma separated list of dots color.
           #                The first one is 0 contribution, then it goes from the low contribution to the highest.
           #                Exactly 5 colors are expected.
           #example:
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=blue
            dist/snake-light.svg?color_snake=#7845ab
            dist/snake-ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
      
         # outputs: # optional
